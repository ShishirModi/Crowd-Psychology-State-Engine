# CPSE Configuration
api:
  tomtom:
    # Set use_env_key: true and export TOMTOM_API_KEY=<your_key>
    # The app falls back to simulation automatically if the key is missing.
    use_env_key: true
    env_key_name: "TOMTOM_API_KEY"
    base_url: "https://api.tomtom.com/traffic/services/4/flowSegmentData"
    search_url: "https://api.tomtom.com/search/2/search"

  openweathermap:
    # Set use_env_key: true and export OPENWEATHERMAP_API_KEY=<your_key>
    use_env_key: true
    env_key_name: "OPENWEATHERMAP_API_KEY"
    base_url: "https://api.openweathermap.org/data/2.5/weather"

# ── Neon PostgreSQL database ─────────────────────────────────────────────────
# Password is read from the NEON_PASS environment variable (or st.secrets).
# The schema is created / migrated automatically on first connection.
database:
  type: "neon"
  pooler_host: "ep-aged-cherry-aoxn5nod-pooler.c-2.ap-southeast-1.aws.neon.tech"
  direct_host: "ep-aged-cherry-aoxn5nod.c-2.ap-southeast-1.aws.neon.tech"
  name:        "neondb"
  role:        "neondb_owner"
  port:        5432
  password_env: "NEON_PASS"

location:
  # Default monitoring point — can be changed interactively in the UI
  name: "Delhi City Center"
  lat: 28.6139
  lon: 77.2090
  radius: 2000  # metres

# Classification thresholds
thresholds:
  compression_gradient:
    stable:      0.1
    compressing: 0.5
    volatile:    0.8
  velocity_variance:
    high: 2.0

simulation:
  enabled: true  # Automatic fallback when API key is absent or request fails
